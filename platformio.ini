[env:genericSTM32F407ZET6]
platform          = ststm32
board             = black_f407ze
framework         = stm32cube
upload_protocol   = stlink
debug_tool        = stlink
monitor_speed     = 115200
build_type        = release
build_flags =
    -D STM32F407xx
    -D USE_HAL_DRIVER
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-rtti
    -fno-exceptions
    -std=gnu++17
    -Wall
    -Wextra
    ; ---- SD Card + FatFS (розкоментувати коли є карта + BSP FatFS) ----
    ;-D USE_FATFS
    ; Розкоментувати, якщо є стм32куб BSP FatFS + stm32f4xx_hal_sd.c + sd_diskio.c
    ; і карта вставлена в SDIO слот.  Без цього define працює fallback defaults.
build_unflags =
    -std=gnu++11
    -std=gnu++14
