[env:genericSTM32F407ZET6]
platform          = ststm32
board             = genericSTM32F407ZET6
framework         = stm32cube
upload_protocol   = stlink
debug_tool        = stlink
monitor_speed     = 115200
build_type        = release
build_flags =
    -D STM32F407xx
    -D USE_HAL_DRIVER
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-rtti
    -fno-exceptions
    -std=gnu++17
build_unflags =
    -std=gnu++11
    -std=gnu++14
